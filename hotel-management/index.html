<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Hotel Guest Registration</h2>

<div class="text-end mb-3">
<a href="view.html" class="btn btn-secondary">View Submissions</a>
</div>

<form id="guestForm">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" id="name">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Phone Number</label>
<input type="number" class="form-control" id="phone">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" id="email">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Aadhar Card Number</label>
<input type="number" class="form-control" id="aadhar">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Check-in Date</label>
<input type="date" class="form-control" id="checkin">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Check-out Date</label>
<input type="date" class="form-control" id="checkout">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">No of Adults</label>
<input type="number" class="form-control" id="adults">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">No of Children</label>
<input type="number" class="form-control" id="children">
</div>

<div class="col-md-12 mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" id="address"></textarea>
</div>

<div class="col-md-12 mb-3">
<label class="form-label">Purpose of Visit</label>
<textarea class="form-control" id="purpose"></textarea>
</div>

<div class="col-12 text-center">
<button type="submit" class="btn btn-primary">Submit</button>
</div>

</div>

</form>

</div>

<script src="script.js"></script>

</body>

</html>
